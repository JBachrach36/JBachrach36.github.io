# Imports a slide deck from a list of per-slide PDF export links in
# deck-import/<slug>.txt: merges them into static/decks/<slug>.pdf, renders
# sharp slide images, rebuilds the deck pages, commits, and republishes.
name: Import deck

on:
  push:
    branches: [main]
    paths: ["deck-import/*.txt"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils webp
      - name: Download, merge and render
        run: |
          set -e
          for list in deck-import/*.txt; do
            [ -e "$list" ] || continue
            slug=$(basename "$list" .txt)
            work=$(mktemp -d); n=0
            while read -r url; do
              [ -z "$url" ] && continue
              n=$((n+1)); f=$(printf "%s/%02d.pdf" "$work" "$n")
              curl -sSfL --retry 3 -o "$f" "$url"
            done < "$list"
            mkdir -p static/decks; rm -rf "static/decks/$slug-slides"; mkdir -p "static/decks/$slug-slides"
            pdfunite "$work"/*.pdf "static/decks/$slug.pdf"
            i=0
            for f in "$work"/*.pdf; do
              i=$((i+1)); out=$(printf "static/decks/%s-slides/%02d" "$slug" "$i")
              pdftoppm -png -singlefile -scale-to-x 2880 -scale-to-y -1 -aa yes -aaVector yes "$f" "$out"
              cwebp -quiet -q 92 -m 6 "$out.png" -o "$out.webp"; rm "$out.png"
            done
            echo "$slug: $i slides"; git rm -q "$list"
          done
          python3 build_decks.py static
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A static deck-import
          git commit -m "Import deck slides and PDF" || exit 0
          git push
      - name: Republish site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mirror.yml --ref main
